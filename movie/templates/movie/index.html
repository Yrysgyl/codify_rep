{% extends "base.html" %}

{% block content %}
  <h1>Фильмы</h1>
  <div class="movie_list">
    {% for movie in movies %}
      <div class="movie-item">
        <h2><a href="{% url 'movie_detail' movie.pk %}">{{ movie.name }}</a></h2>
        {% if movie.image %}
          <img src="{{ movie.image.url }}" alt="{{ movie.name }}" width="300">
        {% endif %}
      </div>
    {% endfor %}
  </div>
{% endblock %}
